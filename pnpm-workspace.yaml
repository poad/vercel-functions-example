packages:
  - ./

allowBuilds:
  bufferutil: false
  esbuild: false
  unrs-resolver: false
  utf-8-validate: false

allowBuilds:
  '@apollo/protobufjs': false
  core-js-pure: false
  esbuild: false
  msw: false
  sharp: false
  unrs-resolver: false

blockExoticSubdeps: true

minimumReleaseAge: 10080 # 7 days in minutes

minimumReleaseAgeExclude:
  - pnpm@11.20.0

trustPolicy: no-downgrade
