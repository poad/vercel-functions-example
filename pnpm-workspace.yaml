  path-to-regexp@>=8.0.0 <8.4.0: ^8.4.0
  semver: '>=7'
  smol-toml@<1.6.1: ^1.6.1
  tar@<7.5.8: ^7.5.8
  tar@<=7.5.10: ^7.5.11
  tar@<=7.5.15: ^7.5.16
  tar@<=7.5.16: ^7.5.17
  tar@<=7.5.17: ^7.5.18
  tar@<=7.5.18: ^7.5.19
  tar@<=7.5.20: ^7.5.21
  tar@<=7.5.9: ^7.5.10
  undici@<6.27.0: ^6.27.0

trustPolicy: no-downgrade
